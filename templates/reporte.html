<!DOCTYPE html>
<html>
<head>
    <title>Reporte</title>
</head>
<body>
    <h2>Reporte de Asistencia</h2>

    <table border="1">
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
        </tr>

        {% for fila in datos %}
        <tr>
            <td>{{ fila[0] }}</td>
            <td>{{ fila[1] }}</td>
            <td>{{ fila[2] }}</td>
            <td>{{ fila[3] }}</td>
            <td>{{ fila[4] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Volver</a>
</body>
</html>
