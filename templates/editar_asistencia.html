<!DOCTYPE html>
<html>
<head>
    <title>Editar Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Editar Asistencia</h2>
    {% if mensaje %}
    <div class="alert alert-info">{{ mensaje }}</div>
    {% endif %}

    <form method="post" class="card p-3">
        <div class="mb-2">
            <label>Usuario</label>
            <input type="text" class="form-control" value="{{ asistencia[1] }} - {{ asistencia[2] }}" disabled>
        </div>
        <div class="mb-2">
            <label>Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ asistencia[3] }}" required>
        </div>
        <div class="mb-2">
            <label>Hora entrada</label>
            <input type="time" name="hora_entrada" class="form-control" value="{{ asistencia[4] }}" required>
        </div>
        <div class="mb-2">
            <label>Hora salida</label>
            <input type="time" name="hora_salida" class="form-control" value="{{ asistencia[5] }}">
        </div>
        <button class="btn btn-primary">Guardar cambios</button>
        <a href="/admin/asistencia" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>
</body>
</html>
